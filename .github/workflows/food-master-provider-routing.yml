name: Food Master Provider Routing

on:
  pull_request:
    paths:
      - 'config/food-master-provider-policy.json'
      - 'scripts/route-food-master-providers.py'
      - 'scripts/test-food-master-provider-routing.py'
      - 'scripts/export-effective-food-master.mjs'
      - 'scripts/audit-food-master-official-sources.mjs'
      - 'overrides/pfc-food-master-mext-registry.js'
      - 'overrides/pfc-food-master-restaurant-registry.js'
      - '.github/workflows/food-master-provider-routing.yml'
  workflow_dispatch:
  schedule:
    - cron: '12 22 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mirror controls
        uses: actions/checkout@v4

      - name: Checkout pinned PFC source read-only
        uses: actions/checkout@v4
        with:
          repository: TAMAFIT/pfc
          ref: cf2d53990860a108d96596abc6eed81e0afd32ae
          path: _source_pfc
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test provider routing policy
        run: python scripts/test-food-master-provider-routing.py

      - name: Export effective Food Master
        run: node scripts/export-effective-food-master.mjs _source_pfc/database.js food-master-effective.json

      - name: Audit official source namespaces
        run: node scripts/audit-food-master-official-sources.mjs food-master-effective.json food-master-official-source-audit.json

      - name: Route foods to authoritative providers
        run: |
          python scripts/route-food-master-providers.py \
            --food-master food-master-effective.json \
            --policy config/food-master-provider-policy.json \
            --out-json food-master-provider-routing.json \
            --out-md food-master-provider-routing.md

      - name: Validate routing coverage
        run: |
          python - <<'PY'
          import json
          r=json.load(open('food-master-provider-routing.json',encoding='utf-8'))
          assert r['canonicalRows']==439, r['canonicalRows']
          assert sum(r['statusCounts'].values())==439
          assert r['statusCounts'].get('verified',0)>=57
          assert not any(x['nutritionProvider']=='manual-review' for x in r['queue'])
          print('provider-routing-ok',r['statusCounts'])
          PY

      - name: Publish routing summary
        run: |
          cat food-master-provider-routing.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '## Official-source audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat food-master-official-source-audit.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload routing evidence
        uses: actions/upload-artifact@v4
        with:
          name: food-master-provider-routing
          path: |
            food-master-provider-routing.json
            food-master-provider-routing.md
            food-master-official-source-audit.json
            food-master-effective.json

      - name: Comment pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo '<!-- pfc-provider-routing -->'
            cat food-master-provider-routing.md
          } > /tmp/provider-routing-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/provider-routing-comment.md
