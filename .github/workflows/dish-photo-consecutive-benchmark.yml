name: Dish photo consecutive benchmark
on:
  push:
    branches: [agent/dish-photo-consecutive-benchmark]
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/benchmark-dish-photo-consecutive.py
