name: D4 MEXT Batch2 Bootstrap

on:
  pull_request:
    paths:
      - 'scripts/bootstrap-mext-registry-batch2.py'
      - '.github/workflows/d4-batch2-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/food-master-d4-triage-batch2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add curated batch2
        run: |
          python scripts/bootstrap-mext-registry-batch2.py \
            --registry overrides/pfc-food-master-mext-registry.js \
            --write \
            --out-json mext-batch2-bootstrap.json

      - name: Commit registry update
        shell: bash
        run: |
          if git diff --quiet -- overrides/pfc-food-master-mext-registry.js; then
            echo 'Registry already contains batch2.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add overrides/pfc-food-master-mext-registry.js
          git commit -m 'Add curated MEXT Food Master batch2'
          git push origin "HEAD:${{ github.head_ref }}"
