name: VoiceDev PFC Mirror CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish_ready: ${{ steps.project.outputs.publish_ready }}
    steps:
      - name: Checkout mirror controls
        uses: actions/checkout@v4

      - name: Checkout pinned production source read-only
        uses: actions/checkout@v4
        with:
          repository: TAMAFIT/pfc
          ref: cf2d53990860a108d96596abc6eed81e0afd32ae
          path: _source_pfc
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve publish state
        id: project
        shell: bash
        run: |
          PUBLISH_READY=$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('.voicedev/config.json','utf8'));process.stdout.write(c.deployment?.type==='github-pages'?'true':'false')")
          echo "publish_ready=$PUBLISH_READY" >> "$GITHUB_OUTPUT"

      - name: Build isolated green mirror
        run: node scripts/build-mirror.mjs

      - name: Apply trainer AI and mirror overlays
        run: node scripts/apply-trainer-avatar.mjs

      - name: Apply Database V3 natural-unit catalog
        run: node scripts/apply-database-v3-catalog.mjs

      - name: Test Database V3 scaling semantics
        run: node scripts/test-database-v3.mjs dist/pfc-database-v3.js

      - name: Test Database V3 natural-unit catalog
        run: node scripts/test-database-v3-catalog.mjs dist/pfc-database-v3.js dist/pfc-database-v3-catalog.js

      - name: Validate mirror safety and PWA essentials
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/manifest.json
          test -f dist/sw.js
          test -f dist/icon-mirror.svg
          test -f dist/mirror-storage.js
          test -f dist/tamachan-data.js
          test -f dist/trainer-ai-avatar.webp
          test -f dist/pfc-v21.js
          test -f dist/pfc-v21-search-fix.js
          test -f dist/pfc-v21.css
          test -f dist/pfc-dummy-v22.js
          test -f dist/pfc-model-selector-v23.js
          test -f dist/pfc-model-selector-bridge-v23.js
          test -f dist/pfc-database-v3.js
          test -f dist/pfc-database-v3-catalog.js
          test -f dist/pfc-database-v3-manual.js
          test -f dist/pfc-input-v25.js
          test -f dist/pfc-input-v25.css
          test ! -f dist/pfc-input-v24.js
          test ! -f dist/pfc-input-v24.css
          test ! -e dist/gas
          test ! -e dist/.github
          test ! -e dist/.voicedev
          node --check dist/sw.js
          node --check dist/mirror-storage.js
          node --check dist/tamachan-data.js
          node --check dist/ai.js
          node --check dist/pfc-v21.js
          node --check dist/pfc-v21-search-fix.js
          node --check dist/pfc-dummy-v22.js
          node --check dist/pfc-model-selector-v23.js
          node --check dist/pfc-model-selector-bridge-v23.js
          node --check dist/pfc-database-v3.js
          node --check dist/pfc-database-v3-catalog.js
          node --check dist/pfc-database-v3-manual.js
          node --check dist/pfc-input-v25.js
          grep -q 'PFC Mirror' dist/manifest.json
          grep -q '#22a06b' dist/manifest.json
          grep -q 'pfc-mirror:v1:' dist/mirror-storage.js
          grep -q '__PFC_AI_V2__' dist/tamachan-data.js
          grep -q '大林トレーナーAI' dist/tamachan-data.js
          grep -q 'tryHandleLocalSkinCorrection' dist/tamachan-data.js
          grep -q "version: '2.0.1'" dist/tamachan-data.js
          grep -q 'trainer-ai-avatar.webp' dist/index.html
          grep -q '大林トレーナーAI' dist/index.html
          grep -q 'trainer-ai-avatar.webp' dist/ai.js
          grep -q 'pfc-v21.js' dist/index.html
          grep -q 'pfc-v21-search-fix.js' dist/index.html
          grep -q 'pfc-v21.css' dist/index.html
          grep -q 'pfc-dummy-v22.js' dist/index.html
          grep -q 'pfc-model-selector-v23.js' dist/index.html
          grep -q 'pfc-model-selector-bridge-v23.js' dist/index.html
          grep -q 'pfc-database-v3.js' dist/index.html
          grep -q 'pfc-database-v3-catalog.js' dist/index.html
          grep -q 'pfc-database-v3-manual.js' dist/index.html
          grep -q 'pfc-input-v25.js' dist/index.html
          grep -q 'pfc-input-v25.css' dist/index.html
          ! grep -q 'pfc-input-v24' dist/index.html
          grep -q '__PFC_SEARCH_V21__' dist/pfc-v21.js
          grep -q "VERSION = '2.1.0'" dist/pfc-v21.js
          grep -q '__PFC_SEARCH_V21_BROAD__' dist/pfc-v21-search-fix.js
          grep -q "version: '2.1.1'" dist/pfc-v21-search-fix.js
          grep -q '__PFC_DUMMY_V22__' dist/pfc-dummy-v22.js
          grep -q "VERSION = '2.2.0'" dist/pfc-dummy-v22.js
          grep -q 'realistic-simulation' dist/pfc-dummy-v22.js
          grep -q '__PFC_MODEL_SELECTOR_V23__' dist/pfc-model-selector-v23.js
          grep -q "source: 'models.list'" dist/pfc-model-selector-v23.js
          grep -q '上限を見る' dist/pfc-model-selector-v23.js
          grep -q '__PFC_MODEL_SELECTOR_BRIDGE_V23__' dist/pfc-model-selector-bridge-v23.js
          grep -q 'directModelIds: true' dist/pfc-model-selector-bridge-v23.js
          grep -q '__PFC_DB_V3__' dist/pfc-database-v3.js
          grep -q "VERSION = '3.0.0'" dist/pfc-database-v3.js
          grep -q 'nutritionBasis' dist/pfc-database-v3.js
          grep -q 'multiplierFor' dist/pfc-database-v3.js
          grep -q 'MIGRATION_MARKER' dist/pfc-database-v3.js
          grep -q '__PFC_DB_V3_CATALOG__' dist/pfc-database-v3-catalog.js
          grep -q "VERSION = '3.1.0'" dist/pfc-database-v3-catalog.js
          grep -q 'BUNDLE_COUNT_BASES' dist/pfc-database-v3-catalog.js
          grep -q 'MEAL_AS_ONE_SERVING' dist/pfc-database-v3-catalog.js
          grep -q 'maffRiceServingGuide' dist/pfc-database-v3-catalog.js
          grep -q 'maffEggStandard' dist/pfc-database-v3-catalog.js
          grep -q '__PFC_DB_V3_MANUAL__' dist/pfc-database-v3-manual.js
          grep -q 'unitAwareButtons: true' dist/pfc-database-v3-manual.js
          grep -q 'storedKcalScaling: true' dist/pfc-database-v3-manual.js
          grep -q 'explicitAlcoholOnly: true' dist/pfc-database-v3-manual.js
          grep -q '__PFC_INPUT_V25__' dist/pfc-input-v25.js
          grep -q "VERSION = '2.5.1'" dist/pfc-input-v25.js
          grep -q 'visibleSmartPanel: false' dist/pfc-input-v25.js
          grep -q 'quickStepper: true' dist/pfc-input-v25.js
          grep -q 'smartCommandSearch: true' dist/pfc-input-v25.js
          grep -q 'databaseV3Aware' dist/pfc-input-v25.js
          grep -q '.v25-stepper' dist/pfc-input-v25.css
          grep -q '.v25-command-hit' dist/pfc-input-v25.css
          grep -q '.btn-voice-main' dist/pfc-v21.css
          grep -q '#voice-ui-window' dist/pfc-v21.css
          ! grep -q '🥚 たまちゃんコーチ' dist/index.html

  deploy:
    if: needs.validate.outputs.publish_ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Checkout mirror controls
        uses: actions/checkout@v4

      - name: Checkout pinned production source read-only
        uses: actions/checkout@v4
        with:
          repository: TAMAFIT/pfc
          ref: cf2d53990860a108d96596abc6eed81e0afd32ae
          path: _source_pfc
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build isolated green mirror
        run: node scripts/build-mirror.mjs

      - name: Apply trainer AI and mirror overlays
        run: node scripts/apply-trainer-avatar.mjs

      - name: Apply Database V3 natural-unit catalog
        run: node scripts/apply-database-v3-catalog.mjs

      - name: Test Database V3 scaling semantics
        run: node scripts/test-database-v3.mjs dist/pfc-database-v3.js

      - name: Test Database V3 natural-unit catalog
        run: node scripts/test-database-v3-catalog.mjs dist/pfc-database-v3.js dist/pfc-database-v3-catalog.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
