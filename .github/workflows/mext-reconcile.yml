name: MEXT Food Master Reconcile

on:
  pull_request:
    paths:
      - 'overrides/pfc-food-master-mext-registry.js'
      - 'scripts/mext-reconcile.py'
      - 'scripts/mext-reconcile-identifiers.py'
      - 'scripts/mext-generate-registry-sync.py'
      - 'scripts/test-mext-reconcile.py'
      - 'scripts/test-mext-generate-registry-sync.py'
      - '.github/workflows/mext-reconcile.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * 1'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: mext-food-master-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'maintenance' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout mirror controls
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook parser
        run: python -m pip install --disable-pip-version-check 'openpyxl>=3.1,<4'

      - name: Test reconciliation parser
        run: python scripts/test-mext-reconcile.py

      - name: Test registry sync generator
        run: python scripts/test-mext-generate-registry-sync.py

      - name: Reconcile central MEXT Food Master registry
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mext-reconcile-identifiers.py \
            --verified overrides/pfc-food-master-mext-registry.js \
            --out-json mext-reconcile-report.json \
            --out-md mext-reconcile-report.md

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('mext-reconcile-report.json', encoding='utf-8'))
          print(f"checked={r['checked']}")
          print(f"confirmed={r['confirmed']}")
          print(f"drift={r['drift']}")
          print(f"missing={r['missing']}")
          print(f"sha256={r['source']['sha256']}")
          print(f"workbook_url={r['source']['workbookUrl']}")
          PY

      - name: Generate safe registry sync candidate
        if: github.event_name != 'pull_request'
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mext-generate-registry-sync.py \
            --report mext-reconcile-report.json \
            --registry overrides/pfc-food-master-mext-registry.js \
            --write \
            --out-json mext-registry-sync.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('mext-registry-sync.json', encoding='utf-8'))
          print('changed=' + ('true' if r['contentChanged'] else 'false'))
          print(f"nutrition_changes={len(r['nutritionChanges'])}")
          print(f"metadata_changes={len(r['metadataChanges'])}")
          print(f"missing_registry={len(r['missingRegistryItems'])}")
          PY

      - name: Publish reconciliation summary
        if: always()
        shell: bash
        run: |
          if [ -s mext-reconcile-report.md ]; then
            cat mext-reconcile-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'MEXT reconciliation did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s mext-registry-sync.json ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '## Registry sync candidate' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat mext-registry-sync.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mext-food-master-reconcile
          path: |
            mext-reconcile-report.json
            mext-reconcile-report.md
            mext-registry-sync.json
          if-no-files-found: warn

      - name: Comment pull request
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [ -s mext-reconcile-report.md ]; then
            {
              echo '<!-- pfc-mext-reconcile -->'
              cat mext-reconcile-report.md
              echo
              echo '_Official MEXT workbook is discovered from the current MEXT publication page on every run._'
            } > /tmp/mext-pr-comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/mext-pr-comment.md --edit-last --create-if-none
          fi

      - name: Create or update MEXT sync pull request
        if: github.event_name != 'pull_request' && steps.sync.outputs.changed == 'true' && steps.reconcile.outputs.missing == '0'
        id: sync_pr
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: bot/mext-food-master-sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$SYNC_BRANCH"
          git add overrides/pfc-food-master-mext-registry.js
          git commit -m 'Sync Food Master with current MEXT'
          git push --force origin "$SYNC_BRANCH"

          cat > /tmp/mext-sync-pr.md <<'EOF'
          ## Automated MEXT Food Master sync

          The scheduled official-source reconciliation detected a new MEXT snapshot and/or nutrition drift and generated this review-only update.

          - Checked: ${{ steps.reconcile.outputs.checked }}
          - Drift before sync: ${{ steps.reconcile.outputs.drift }}
          - Nutrition changes: ${{ steps.sync.outputs.nutrition_changes }}
          - Metadata changes: ${{ steps.sync.outputs.metadata_changes }}
          - Official workbook SHA-256: `${{ steps.reconcile.outputs.sha256 }}`

          This PR is **never auto-merged**. The central registry is updated by MEXT item number; normal app usage remains local-first and does not call MEXT.
          EOF

          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$SYNC_BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$SYNC_BRANCH" --title '[MEXT] Sync Food Master registry' --body-file /tmp/mext-sync-pr.md)
            PR=${URL##*/}
          else
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --title '[MEXT] Sync Food Master registry' --body-file /tmp/mext-sync-pr.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Official MEXT sync candidate refreshed from workflow run $GITHUB_RUN_ID."
          fi
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN-created PR events do not recursively start workflows.
          # Dispatch the validation suites explicitly on the generated branch.
          gh workflow run voicedev.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
          gh workflow run database-v3-audit.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
          gh workflow run mext-auto-map.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
          gh workflow run mext-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"

      - name: Open or refresh reconciliation issue
        if: github.event_name != 'pull_request' && (steps.reconcile.outputs.drift != '0' || steps.reconcile.outputs.missing != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- pfc-mext-reconcile-drift -->'
            cat mext-reconcile-report.md
            echo
            if [ -n "${{ steps.sync_pr.outputs.pr_number }}" ]; then
              echo "Generated review PR: #${{ steps.sync_pr.outputs.pr_number }}"
            fi
            echo "Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > /tmp/mext-issue.md
          ISSUE=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'MEXT Food Master reconciliation drift in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/mext-issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title '[MEXT] Food Master reconciliation drift' --body-file /tmp/mext-issue.md
          fi

      - name: Enforce official parity on pull requests
        if: github.event_name == 'pull_request' && (steps.reconcile.outputs.drift != '0' || steps.reconcile.outputs.missing != '0')
        run: |
          echo 'MEXT-backed Food Master entries are not in parity with the current official workbook.' >&2
          exit 1
