name: Dish photo two-model probe
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/dish-photo-two-model-probe]
    paths: [.github/workflows/dish-photo-two-model-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe one image request per model
        run: |
          python - <<'PY'
          import base64, json, time, urllib.request
          endpoint='https://script.google.com/macros/s/AKfycbxRNfeijUEwXwoFgBYbS60S5zn2fcuqHSm4TAbRePUzjTjqInXu10ZmK4cUvxoJ-dCAxw/exec'
          image_bytes=urllib.request.urlopen('https://goo.gle/instrument-img', timeout=15).read()
          img=base64.b64encode(image_bytes).decode()
          def call(model):
            payload={'taskType':'image','modelPreference':model,'contents':[{'parts':[{'text':'画像の内容を短いJSONで返してください。'}]}],'imageBase64':img,'generationConfig':{'thinkingConfig':{'thinkingLevel':'minimal'},'maxOutputTokens':128,'responseMimeType':'application/json','mediaResolution':'MEDIA_RESOLUTION_LOW'}}
            req=urllib.request.Request(endpoint,data=json.dumps(payload,separators=(',',':')).encode(),headers={'Content-Type':'text/plain'},method='POST')
            t=time.monotonic()
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read().decode('utf-8','replace')
                print(json.dumps({'model':model,'http':r.status,'seconds':round(time.monotonic()-t,3),'body':body[:500]},ensure_ascii=False))
            except Exception as e:
              print(json.dumps({'model':model,'seconds':round(time.monotonic()-t,3),'error':repr(e)},ensure_ascii=False))
          call('gemini-3.5-flash-lite')
          time.sleep(10)
          call('gemini-3.1-flash-lite')
          PY
